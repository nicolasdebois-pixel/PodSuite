# Compile whisper-cli pour Mac (binaire universel : puces Apple et Intel), sans dépendance, et le publie dans la
# version « whisper-macos » du dépôt : l'installation de la boîte à outils le télécharge, plus besoin de Homebrew.
# À relancer à la main (onglet Actions › « Whisper pour Mac » › Run workflow) pour changer de version de whisper.cpp.
name: Whisper pour Mac
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de whisper.cpp"
        default: "v1.9.5"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Sources de whisper.cpp
        run: git clone --depth 1 --branch "${{ github.event.inputs.version || 'v1.9.5' }}" https://github.com/ggml-org/whisper.cpp.git src
      - name: Compilation (statique, Metal intégré, puces Apple + Intel)
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF \
                -DGGML_METAL_EMBED_LIBRARY=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DGGML_NATIVE=OFF \
                "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          cmake --build build --config Release -j 4 --target whisper-cli
          file build/bin/whisper-cli
          otool -L build/bin/whisper-cli
          build/bin/whisper-cli --help 2>&1 | head -3
          cp build/bin/whisper-cli whisper-cli-macos-arm64
          cp build/bin/whisper-cli whisper-cli-macos-x86_64
      - name: Publier dans la version « whisper-macos »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view whisper-macos -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create whisper-macos -R "$GITHUB_REPOSITORY" --title "Whisper pour Mac" \
              --notes "whisper-cli compilé pour Mac (puces Apple et Intel), téléchargé automatiquement par l'installation de Podcast & ADR Toolbox."
          gh release upload whisper-macos whisper-cli-macos-arm64 whisper-cli-macos-x86_64 -R "$GITHUB_REPOSITORY" --clobber
